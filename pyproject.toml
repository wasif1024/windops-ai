    "services/agent-runtime-service/tests",
    "services/external-intelligence-service/src",
    "services/external-intelligence-service/tests",
    "services/fault-detection-service/src",
    "services/fault-detection-service/tests",
    "services/identity-service/src",
    "services/identity-service/tests",
    "services/investigation-service/src",
