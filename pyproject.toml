[project]
name = "windops-ai"
version = "0.1.0"
description = "Agentic AI platform for wind farm operations and predictive maintenance"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "mcp-servers/documentation-mcp",
    "mcp-servers/filesystem-mcp",
    "mcp-servers/postgres-mcp",
    "mcp-servers/tavily-mcp",
    "mcp-servers/weather-mcp",
    "mcp-servers/windops-mcp",
    "services/agent-runtime-service",
    "services/alarm-service",
    "services/asset-service",
    "services/audit-service",
    "services/authorization-service",
    "services/external-intelligence-service",
    "services/fault-detection-service",
    "services/identity-service",
    "services/investigation-service",
    "services/knowledge-service",
    "services/policy-service",
    "services/production-impact-service",
    "services/sample-caller-service",
    "services/sample-responder-service",
    "services/telemetry-service",
    "services/tenant-service",
    "services/weather-service",
    "services/web-bff-service",
    "shared/auth",
    "shared/cache",
    "shared/claude",
    "shared/contracts",
    "shared/events",
    "shared/grpc",
    "shared/mcp",
    "shared/migrations",
    "shared/observability",
    "shared/outbox",
    "shared/resilience",
    "shared/screening",
    "simulator",
]

[tool.uv.sources]
windops-auth = { workspace = true }
windops-cache = { workspace = true }
windops-claude = { workspace = true }
windops-events = { workspace = true }
windops-migrations = { workspace = true }
windops-outbox = { workspace = true }
windops-observability = { workspace = true }
windops-resilience = { workspace = true }
windops-screening = { workspace = true }
windops-grpc = { workspace = true }
windops-mcp = { workspace = true }
windops-mcp-documentation = { workspace = true }
windops-mcp-windops = { workspace = true }
windops-mcp-filesystem = { workspace = true }
windops-mcp-postgres = { workspace = true }
windops-mcp-tavily = { workspace = true }
windops-mcp-weather = { workspace = true }
windops-contracts = { workspace = true }
windops-sample-caller = { workspace = true }
windops-sample-responder = { workspace = true }
windops-audit = { workspace = true }
windops-authorization = { workspace = true }
windops-identity = { workspace = true }
windops-tenant = { workspace = true }
windops-simulator = { workspace = true }
windops-web-bff = { workspace = true }
windops-asset = { workspace = true }
windops-telemetry = { workspace = true }
windops-alarm = { workspace = true }
windops-fault-detection = { workspace = true }
windops-investigation = { workspace = true }
windops-policy = { workspace = true }
windops-production-impact = { workspace = true }
windops-weather = { workspace = true }
windops-knowledge = { workspace = true }
windops-agent-runtime = { workspace = true }
windops-external-intelligence = { workspace = true }

[tool.ruff]
line-length = 100
extend-exclude = ["shared/contracts/src/windops"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"shared/*/tests/**" = ["S101", "S105", "S106"]
"services/*/tests/**" = ["S101", "S105", "S106"]
"simulator/tests/**" = ["S101"]
"mcp-servers/*/tests/**" = ["S101"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "scripts",
    "services/alarm-service/src",
    "services/alarm-service/tests",
    "services/asset-service/src",
    "services/asset-service/tests",
    "services/audit-service/src",
    "services/audit-service/tests",
    "services/authorization-service/src",
    "services/authorization-service/tests",
