# A breaker's state property changes between reads, which mypy's narrowing cannot see.
[[tool.mypy.overrides]]
module = ["test_breaker", "test_real_grpc"]
disable_error_code = ["comparison-overlap"]

[[tool.mypy.overrides]]
module = ["grpc_health.*", "grpc_tools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "services/*/tests",
    "shared/auth/tests",
    "shared/cache/tests",
    "shared/claude/tests",
    "shared/events/tests",
    "shared/grpc/tests",
    "shared/migrations/tests",
    "shared/observability/tests",
    "shared/outbox/tests",
    "shared/resilience/tests",
    "shared/screening/tests",
    "shared/mcp/tests",
    "mcp-servers/*/tests",
    "simulator/tests",
]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = [".", "services/agent-runtime-service/tests", "shared/grpc/tests", "shared/mcp/tests", "shared/resilience/tests", "services/identity-service/tests", "services/investigation-service/tests", "services/knowledge-service/tests", "services/telemetry-service/tests", "services/tenant-service/tests", "services/web-bff-service/tests"]

[dependency-groups]
dev = [
    # The agent stack, pinned for the vendor checks (M8.1). Each is a release at least two weeks old
    # when chosen; the Agent Runtime takes the same pins (M8.2).
