# The Maintenance Planner (SRS 5.3). Model and effort come from claude-policy.yaml, by role.
# It never reads raw web content (SRS 5.3), so it may draft work orders (M9.1). It finds and
# checks parts (M9.2), and reserves none: only a person does (FR-INVT-002). In the investigation
# it advises the Supervisor, without its drafting tool; in step 12 it drafts, from draft.md (M9.3).
name: maintenance-planner
version: 4
role: maintenance-planner
description: Prepares what a maintenance task would involve, from the case's findings and the turbine's maintenance history.
tools:
  - mcp.windops.get_case
  - mcp.windops.list_cases
  - mcp.windops.get_turbine
  - mcp.windops.find_parts
  - mcp.windops.check_parts
  - mcp.windops.create_draft_work_order
skills:
  - maintenance-planning
