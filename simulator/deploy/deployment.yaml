# Synthetic devices for the demo fleet, streaming through the gateway as real ones would (M4.4).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windops-simulator
  labels:
    app.kubernetes.io/name: windops-simulator
    app.kubernetes.io/component: simulator
    app.kubernetes.io/part-of: windops
spec:
  # Exactly one: a second copy would send every sample twice.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-simulator
        app.kubernetes.io/component: simulator
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: windops-simulator:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            # Settings for every workload, from .env through make config, including
            # WINDOPS_INGEST_URL and the WINDOPS_SIMULATOR_ settings.
            - configMapRef:
                name: windops-settings
          env:
            - name: WINDOPS_TLS_DIR
              value: /var/run/windops/tls
            - name: WINDOPS_SIMULATOR_TOKENS_DIR
              value: /var/run/windops/devices
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /var/run/windops/tls
              readOnly: true
            # One file per turbine. Files, not environment variables, so a token never shows in
            # a process listing or a describe, and a replaced one is picked up without a restart.
            - name: devices
              mountPath: /var/run/windops/devices
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: windops-simulator-tls
            defaultMode: 0440
        - name: devices
          secret:
            secretName: windops-simulator-devices
            defaultMode: 0440
            # make telemetry-devices fills it after the first deploy. Until then, it waits.
            optional: true
