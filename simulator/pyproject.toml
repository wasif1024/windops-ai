[project]
name = "windops-simulator"
version = "0.1.0"
description = "WindOps telemetry simulator: seeded, versioned turbine physics, all marked synthetic"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
windops-simulator = "windops_simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_simulator"]
