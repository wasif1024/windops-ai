# The remaining SRS 10.3 alerts arrive in M13.7, with routing by severity and owner.
groups:
  - name: windops-platform
    rules:
      - alert: WindopsTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.workload }} in {{ $labels.namespace }} cannot be scraped"
      - alert: WindopsCircuitBreakerOpen
        expr: max by (workload, dependency) (windops_circuit_breaker_state) == 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.workload }} has an open breaker for {{ $labels.dependency }}"
      # A crash loop is otherwise easy to miss, because Kubernetes keeps restarting the pod.
      - alert: WindopsPodRestarting
        expr: sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~"windops-.*"}[6h])) >= 3
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.pod }} in {{ $labels.namespace }} has restarted repeatedly"
  - name: windops-events
    rules:
      - alert: WindopsDeadLetterMessages
        expr: increase(jetstream_stream_total_messages{stream_name="WINDOPS_DEAD_LETTER"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A message reached the dead-letter stream. Run: make dead-letters"
      - alert: WindopsOutboxBacklog
        expr: max by (workload) (windops_outbox_oldest_waiting_seconds) > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.workload }} has outbox events waiting for over 5 minutes"
      - alert: WindopsOutboxRowsSetAside
        expr: max by (workload) (windops_outbox_failed) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.workload }} has outbox rows it cannot read"
      - alert: WindopsConsumerLag
        expr: max by (consumer_name, stream_name) (jetstream_consumer_num_pending) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.consumer_name }} is behind on {{ $labels.stream_name }}"
      - alert: WindopsDataStoreDown
        expr: >-
          kube_statefulset_status_replicas_ready{namespace="windops-data"} == 0
          or kube_deployment_status_replicas_available{namespace="windops-data"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "A data store in windops-data has no ready replica"
  # SRS 10.3: suspicious authorization failures and security-relevant administrator events.
  - name: windops-security
    rules:
      - alert: WindopsManyFailedSignIns
        expr: sum(increase(keycloak_user_events_total{realm="windops",event="login",error!=""}[10m])) > 20
        labels:
          severity: warning
          category: security
        annotations:
          summary: "More than 20 failed sign-ins in 10 minutes. See the Security dashboard"
      - alert: WindopsManyAccessDenials
        expr: sum(increase(windops_audit_records_total{action="authorization.denied"}[10m])) > 20
        labels:
          severity: warning
          category: security
        annotations:
          summary: "More than 20 access denials in 10 minutes. The administrator console lists who and what"
      - alert: WindopsSustainedRateLimiting
        expr: sum(increase(apisix_http_status{code="429"}[10m])) > 100
        labels:
          severity: warning
          category: security
        annotations:
          summary: "The gateway refused more than 100 requests for their rate in 10 minutes"
      - alert: WindopsBreakGlassStarted
        expr: sum(increase(windops_audit_records_total{action="authorization.break_glass.started"}[5m])) > 0
        labels:
          severity: info
          category: security
        annotations:
          summary: "A Platform Administrator started break-glass access to a tenant (RBAC-003)"
      - alert: WindopsAdministratorRoleGranted
        expr: sum by (action) (increase(windops_audit_records_total{action=~"authorization\\.role\\.granted\\.(tenant|platform)-administrator"}[5m])) > 0
        labels:
          severity: info
          category: security
        annotations:
          summary: "An administrator role was granted: {{ $labels.action }}"
