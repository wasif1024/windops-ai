# Stores traces. SRS 13.1 requires traces locally, and ADR 0002 explains this choice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-tempo-config
  labels:
    app.kubernetes.io/name: windops-tempo
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    # Tempo's defaults suit far larger systems. Writing a block allocated up to 500 MiB here, while
    # storing under 10 MiB of traces, so these keep each write small.
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 24h
    storage:
      trace:
        block:
          parquet_row_group_size_bytes: 20971520
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
    usage_report:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: windops-tempo
  labels:
    app.kubernetes.io/name: windops-tempo
    app.kubernetes.io/part-of: windops
spec:
  serviceName: windops-tempo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-tempo
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3200"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: grafana/tempo:2.9.0@sha256:65a5789759435f1ef696f1953258b9bbdb18eb571d5ce711ff812d2e128288a4
          args: [-config.file=/etc/tempo/tempo.yaml]
          env:
            - name: GOMEMLIMIT
              value: 400MiB
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
      volumes:
        - name: config
          configMap:
            name: windops-tempo-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: windops-tempo
  labels:
    app.kubernetes.io/name: windops-tempo
    app.kubernetes.io/part-of: windops
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: windops-tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
