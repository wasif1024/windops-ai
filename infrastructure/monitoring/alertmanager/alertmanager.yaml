apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-alertmanager-config
  labels:
    app.kubernetes.io/name: windops-alertmanager
data:
  # M13.7 routes alerts by severity and owner. Until then they are visible only here.
  alertmanager.yml: |
    route:
      receiver: "null"
      group_by: [alertname, namespace]
    receivers:
      - name: "null"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windops-alertmanager
  labels:
    app.kubernetes.io/name: windops-alertmanager
    app.kubernetes.io/part-of: windops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-alertmanager
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --cluster.listen-address=
          ports:
            - name: http
              containerPort: 9093
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 10
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: windops-alertmanager-config
        - name: data
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: windops-alertmanager
  labels:
    app.kubernetes.io/name: windops-alertmanager
    app.kubernetes.io/part-of: windops
spec:
  selector:
    app.kubernetes.io/name: windops-alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
