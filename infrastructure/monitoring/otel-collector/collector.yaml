apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-otel-collector-config
  labels:
    app.kubernetes.io/name: windops-otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 96
        spike_limit_mib: 24
      batch: {}
    exporters:
      otlp/tempo:
        endpoint: windops-tempo.windops-observability.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windops-otel-collector
  labels:
    app.kubernetes.io/name: windops-otel-collector
    app.kubernetes.io/part-of: windops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-otel-collector
        app.kubernetes.io/part-of: windops
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector:0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
          args: [--config=/etc/otelcol/config.yaml]
          ports:
            - name: otlp-http
              containerPort: 4318
          startupProbe:
            tcpSocket:
              port: otlp-http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: otlp-http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: otlp-http
            periodSeconds: 10
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: windops-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: windops-otel-collector
  labels:
    app.kubernetes.io/name: windops-otel-collector
    app.kubernetes.io/part-of: windops
spec:
  selector:
    app.kubernetes.io/name: windops-otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
