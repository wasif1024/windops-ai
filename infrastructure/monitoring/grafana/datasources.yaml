apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://windops-prometheus.windops-observability.svc.cluster.local:9090
    isDefault: true
    editable: false
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://windops-loki.windops-observability.svc.cluster.local:3100
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: tempo
          url: "$${__value.raw}"
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://windops-tempo.windops-observability.svc.cluster.local:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
