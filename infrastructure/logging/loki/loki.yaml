apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-loki-config
  labels:
    app.kubernetes.io/name: windops-loki
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: 2026-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      # OBS-004: the local retention. docs/observability.md lists it for each environment.
      retention_period: 168h
      allow_structured_metadata: true
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: windops-loki
  labels:
    app.kubernetes.io/name: windops-loki
    app.kubernetes.io/part-of: windops
spec:
  serviceName: windops-loki
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-loki
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
          args: [-config.file=/etc/loki/loki.yaml]
          env:
            - name: GOMEMLIMIT
              value: 220MiB
          ports:
            - name: http
              containerPort: 3100
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: windops-loki-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: windops-loki
  labels:
    app.kubernetes.io/name: windops-loki
    app.kubernetes.io/part-of: windops
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: windops-loki
  ports:
    - name: http
      port: 3100
      targetPort: http
