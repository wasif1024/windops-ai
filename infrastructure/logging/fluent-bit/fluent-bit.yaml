apiVersion: v1
kind: ServiceAccount
metadata:
  name: windops-fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: windops-fluent-bit
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: windops-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: windops-fluent-bit
subjects:
  - kind: ServiceAccount
    name: windops-fluent-bit
    namespace: windops-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-fluent-bit-config
  labels:
    app.kubernetes.io/name: windops-fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     warn
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

    [INPUT]
        Name              tail
        Path              /var/log/containers/*_windops-*.log
        Exclude_Path      /var/log/containers/*_windops-observability_*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     16MB
        Skip_Long_Lines   On
        Read_from_Head    Off

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           Off
        Keep_Log            On
        Labels              Off
        Annotations         Off

    [OUTPUT]
        Name                   loki
        Match                  kube.*
        Host                   windops-loki.windops-observability.svc.cluster.local
        Port                   3100
        labels                 job=fluent-bit, namespace=$kubernetes['namespace_name'], pod=$kubernetes['pod_name'], container=$kubernetes['container_name']
        remove_keys            kubernetes, stream, time, _p
        line_format            key_value
        drop_single_key        raw
        Retry_Limit            5
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: windops-fluent-bit
  labels:
    app.kubernetes.io/name: windops-fluent-bit
    app.kubernetes.io/part-of: windops
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-fluent-bit
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "2020"
        prometheus.io/path: /api/v2/metrics/prometheus
    spec:
      serviceAccountName: windops-fluent-bit
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4
          args: [--config=/fluent-bit/etc/custom/fluent-bit.conf]
          ports:
            - name: http
              containerPort: 2020
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          # Reading other containers' log files requires root, but nothing else does.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [DAC_READ_SEARCH]
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/custom
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: dockerlogs
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: windops-fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: dockerlogs
          hostPath:
            path: /var/lib/docker/containers
