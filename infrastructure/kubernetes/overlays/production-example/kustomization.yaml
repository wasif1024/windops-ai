# An example for a larger cluster, not a tested production deployment (SRS 2.4). Autoscaling
# arrives in M13.4, and images need a real registry and version tags.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/namespaces
  - ../../base/services
patches:
  - target:
      kind: Deployment
      # Not the simulator: a second copy would send every sample twice.
      labelSelector: app.kubernetes.io/part-of=windops,app.kubernetes.io/component!=simulator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
# The environment's name, log level and addresses are settings, in windops-settings: .env locally
# (make config), and the pipeline's variables elsewhere. See .env.example.
