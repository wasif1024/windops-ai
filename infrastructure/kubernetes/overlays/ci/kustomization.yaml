# Automated checks: one replica each. CI sets WINDOPS_LOG_LEVEL=WARNING for quieter logs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/namespaces
  - ../../base/services
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=windops
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
# The environment's name, log level and addresses are settings, in windops-settings: .env locally
# (make config), and the pipeline's variables elsewhere. See .env.example.
