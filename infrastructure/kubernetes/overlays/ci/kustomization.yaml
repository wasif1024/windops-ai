# Automated checks: one replica each, with quieter logs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/namespaces
  - ../../base/services
patches:
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/part-of=windops
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      labelSelector: app.kubernetes.io/part-of=windops
    patch: |-
      - op: replace
        path: /data/WINDOPS_ENVIRONMENT
        value: ci
      - op: replace
        path: /data/WINDOPS_LOG_LEVEL
        value: WARNING
