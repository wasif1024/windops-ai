# SRS section 11.2. Pod Security "restricted" is enforced where workloads are ours alone.
# Third-party workloads in the other namespaces get warnings until they are checked.
apiVersion: v1
kind: Namespace
metadata:
  name: windops-system
  labels:
    app.kubernetes.io/part-of: windops
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: windops-application
  labels:
    app.kubernetes.io/part-of: windops
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: windops-mcp
  labels:
    app.kubernetes.io/part-of: windops
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: windops-data
  labels:
    app.kubernetes.io/part-of: windops
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: windops-observability
  labels:
    app.kubernetes.io/part-of: windops
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
