# This store's identity, which every client checks (GRP-005).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: windops-qdrant-tls
  labels:
    app.kubernetes.io/name: windops-qdrant
    app.kubernetes.io/part-of: windops
spec:
  secretName: windops-qdrant-tls
  commonName: windops-qdrant
  dnsNames:
    - windops-qdrant
    - windops-qdrant.windops-data
    - windops-qdrant.windops-data.svc
    - windops-qdrant.windops-data.svc.cluster.local
    # For probes inside the pod, and for checks that arrive through a port-forward.
    - localhost
  ipAddresses:
    - 127.0.0.1
  duration: 720h
  renewBefore: 168h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
  issuerRef:
    name: windops-internal
    kind: ClusterIssuer
    group: cert-manager.io
