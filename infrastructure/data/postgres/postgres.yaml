# One server with a separate database and login per service (ARC-003, ADR 0003).
apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-postgres-access
  labels:
    app.kubernetes.io/name: windops-postgres
    app.kubernetes.io/part-of: windops
data:
  # Network logins must use TLS and a password. The socket inside the pod is for provisioning.
  pg_hba.conf: |
    local all all trust
    hostssl all all all scram-sha-256
---
apiVersion: v1
kind: Service
metadata:
  name: windops-postgres
  labels:
    app.kubernetes.io/name: windops-postgres
    app.kubernetes.io/part-of: windops
spec:
  # Reachable only inside the cluster (DEP-007).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: windops-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: windops-postgres
  labels:
    app.kubernetes.io/name: windops-postgres
    app.kubernetes.io/part-of: windops
spec:
  serviceName: windops-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-postgres
        app.kubernetes.io/part-of: windops
    spec:
      automountServiceAccountToken: false
      # Long enough to write everything to disk, so a restart needs no crash recovery.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18.6-alpine3.24@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
          command:
            - sh
            - -c
            - |
              # Load a renewed certificate without a restart, so connections stay open.
              seen=$(cksum < /var/run/windops/tls/tls.crt)
              (
                while sleep 30; do
                  now=$(cksum < /var/run/windops/tls/tls.crt) || continue
                  if [ "$now" != "$seen" ]; then
                    seen="$now"
                    kill -HUP 1
                  fi
                done
              ) &
              exec docker-entrypoint.sh postgres "$@"
            - postgres
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/var/run/windops/tls/tls.crt
            - -c
            - ssl_key_file=/var/run/windops/tls/tls.key
            - -c
            - hba_file=/etc/postgres/pg_hba.conf
            - -c
            - max_connections=100
            - -c
            - shared_buffers=128MB
            - -c
            - effective_cache_size=384MB
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=32MB
            - -c
            - max_wal_size=512MB
          env:
            - name: POSTGRES_USER
              value: windops_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windops-postgres-admin
                  key: password
            # Network logins always need a password, including from inside the pod.
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256 --auth-local=trust
            - name: POSTGRES_HOST_AUTH_METHOD
              value: scram-sha-256
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: [pg_isready, --username=windops_admin, --dbname=postgres, --host=127.0.0.1]
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [pg_isready, --username=windops_admin, --dbname=postgres, --host=127.0.0.1]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, --username=windops_admin, --dbname=postgres, --host=127.0.0.1]
            periodSeconds: 10
            timeoutSeconds: 5
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: tls
              mountPath: /var/run/windops/tls
              readOnly: true
            - name: access
              mountPath: /etc/postgres
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: windops-postgres-tls
            defaultMode: 0440
        - name: access
          configMap:
            name: windops-postgres-access
        - name: run
          emptyDir:
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
