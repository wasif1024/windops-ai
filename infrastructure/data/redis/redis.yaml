# A cache and rate-limit store only (SRS 8.1). It keeps nothing across a restart on purpose, so nothing
# durable can come to rely on it (EVT-005).
apiVersion: v1
kind: Service
metadata:
  name: windops-redis
  labels:
    app.kubernetes.io/name: windops-redis
    app.kubernetes.io/part-of: windops
spec:
  # Reachable only inside the cluster (DEP-007).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: windops-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windops-redis
  labels:
    app.kubernetes.io/name: windops-redis
    app.kubernetes.io/part-of: windops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-redis
        app.kubernetes.io/part-of: windops
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.8.4-alpine3.23@sha256:ab669f1420eaa05360a417b24f3bd210c9272e2c79a4bb35d3e50b4bfd50dbee
          # Skip the image's entrypoint, which would try to change file owners.
          command:
            - redis-server
            - --aclfile
            - /etc/redis/acl/users.acl
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 64mb
            # Only entries with a TTL can be evicted, and windops-cache gives every entry one.
            - --maxmemory-policy
            - volatile-lru
          env:
            # redis-cli reads this, so the password never appears in a process listing.
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: windops-redis-admin
                  key: password
          ports:
            - name: redis
              containerPort: 6379
          startupProbe:
            exec:
              command: &ping [sh, -c, "redis-cli --user windops_admin --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command: *ping
            periodSeconds: 5
          livenessProbe:
            exec:
              command: *ping
            periodSeconds: 10
            timeoutSeconds: 5
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: acl
              mountPath: /etc/redis/acl
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: acl
          secret:
            secretName: windops-redis-acl
            defaultMode: 0440
        - name: data
          emptyDir:
            sizeLimit: 8Mi
