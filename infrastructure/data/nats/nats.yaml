# Durable events and dead letters, through JetStream (SRS 7.6). One server locally, which SRS 2.4
# accepts. `make secrets` creates its configuration, because that holds each service's login.
apiVersion: v1
kind: Service
metadata:
  name: windops-nats
  labels:
    app.kubernetes.io/name: windops-nats
    app.kubernetes.io/part-of: windops
spec:
  # Reachable only inside the cluster (DEP-007). The monitoring port stays off this Service.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: windops-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: windops-nats
  labels:
    app.kubernetes.io/name: windops-nats
    app.kubernetes.io/part-of: windops
spec:
  serviceName: windops-nats
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-nats
        app.kubernetes.io/part-of: windops
    spec:
      automountServiceAccountToken: false
      # Long enough to finish writing streams to disk.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
          command: [nats-server, --config, /etc/nats/nats.conf]
          env:
            # Keeps the Go runtime inside the memory limit below.
            - name: GOMEMLIMIT
              value: 200MiB
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 10
            timeoutSeconds: 5
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: config
          secret:
            secretName: windops-nats-config
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
