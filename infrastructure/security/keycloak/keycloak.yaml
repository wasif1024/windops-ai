# Login, credentials and sessions (SEC-006). The browser reaches only its sign-in pages, through the
# gateway at $WINDOPS_PUBLIC_URL/auth, https://localhost:9443/auth locally. Its admin API is reachable only inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: windops-keycloak
  labels:
    app.kubernetes.io/name: windops-keycloak
    app.kubernetes.io/part-of: windops
spec:
  # The management port stays off this Service.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: windops-keycloak
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windops-keycloak
  labels:
    app.kubernetes.io/name: windops-keycloak
    app.kubernetes.io/part-of: windops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-keycloak
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: windops-keycloak:local
          imagePullPolicy: IfNotPresent
          # Settings for every workload, from .env through make config.
          envFrom:
            - configMapRef:
                name: windops-settings
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: windops_admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windops-keycloak-admin
                  key: password
            - name: KC_DB_URL_HOST
              valueFrom:
                secretKeyRef:
                  name: windops-keycloak-database
                  key: host
            - name: KC_DB_URL_PORT
              valueFrom:
                secretKeyRef:
                  name: windops-keycloak-database
                  key: port
            - name: KC_DB_URL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: windops-keycloak-database
                  key: database
            # Checks the database's certificate and name, so nothing can pose as it (GRP-005).
            - name: KC_DB_URL_PROPERTIES
              value: "?sslmode=verify-full&sslrootcert=/var/run/windops/tls/ca.crt"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: windops-keycloak-database
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windops-keycloak-database
                  key: password
            # HTTPS only, at one fixed public address, which fixes the issuer in every token.
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /var/run/windops/keycloak-tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /var/run/windops/keycloak-tls/tls.key
            # The public address from the settings, which Kubernetes fills in.
            - name: KC_HOSTNAME
              value: $(WINDOPS_PUBLIC_URL)/auth
            # Services inside the cluster may still use its internal address.
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            # Only the gateway's forwarded headers are trusted, from inside the pod network.
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_PROXY_TRUSTED_ADDRESSES
              value: 10.244.0.0/16
            # Probes and Prometheus keep plain HTTP on the management port, which holds no logins.
            - name: KC_HTTP_MANAGEMENT_SCHEME
              value: http
            # One replica locally, so it needs no cluster cache.
            - name: KC_CACHE
              value: local
            - name: JAVA_OPTS_KC_HEAP
              value: -XX:MaxRAMPercentage=60 -XX:InitialRAMPercentage=25
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
            timeoutSeconds: 5
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: keycloak-tls
              mountPath: /var/run/windops/keycloak-tls
              readOnly: true
            - name: trust
              mountPath: /var/run/windops/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /opt/keycloak/data
      volumes:
        - name: keycloak-tls
          secret:
            secretName: windops-keycloak-tls
            defaultMode: 0440
        - name: trust
          secret:
            secretName: windops-trust
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          emptyDir:
            sizeLimit: 64Mi
