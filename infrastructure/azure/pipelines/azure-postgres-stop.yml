# Azure DevOps: stop the staging environment's PostgreSQL every night, if no cluster uses it
# (docs/azure-devops.md).
#
# `make azure-down` stops the server, but Azure starts a stopped server again after 7 days, and it
# would then cost about $29 a month with nothing using it. This puts it back to sleep. It leaves the
# server running while the compute group exists, as a demo is using it then. A run takes about
# 3 minutes of the free tier's 1,800 a month, and needs no approval: it only ever stops things.

trigger: none
pr: none

schedules:
  - cron: "0 2 * * *"
    displayName: Every night at 02:00 UTC
    branches:
      include: [main]
    # Even when nothing has been merged since the last run.
    always: true

variables:
  - group: windops-staging
  - name: AZURE_ENVIRONMENT
    value: staging
  - name: serviceConnection
    value: windops-staging
  - name: UV_VERSION
    value: 0.12.18

pool:
  vmImage: ubuntu-24.04

steps:
  - template: templates/setup.yml
  - task: AzureCLI@2
    displayName: Stop PostgreSQL if no cluster uses it
    inputs:
      azureSubscription: $(serviceConnection)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: uv run python -m scripts.setup.azure_deploy stop-postgres
