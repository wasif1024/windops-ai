apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-gateway-config
  labels:
    app.kubernetes.io/name: windops-gateway
data:
  config.yaml: |
    apisix:
      # Plain HTTP only inside the pod. Everything else uses HTTPS, on 9443 (API-001).
      node_listen:
        - ip: 127.0.0.1
          port: 9080
      enable_ipv6: false
      enable_control: true
      control:
        ip: 127.0.0.1
        port: 9090
      status:
        ip: 0.0.0.0
        port: 7085
      ssl:
        enable: true
        listen:
          - port: 9443
        # Used when a client sends no server name, such as one that connects by IP address.
        fallback_sni: localhost
        # The CA that upstreams with HTTPS, such as Keycloak, must be signed by.
        ssl_trusted_certificate: /var/run/windops/trust/ca.crt
        ssl_protocols: TLSv1.2 TLSv1.3
    # Only what routes use. M3.1 and M3.7 add token checks, CORS and rate limits.
    plugins:
      - opentelemetry
    stream_plugins: []
    nginx_config:
      worker_processes: 1
      # Every upstream with HTTPS is checked against the CA. nginx loads the CA only when this is on
      # in its configuration, so a route's own tls.verify is not enough by itself.
      http_server_configuration_snippet: |
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
      error_log_level: warn
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      admin:
        admin_key_required: true
        admin_key:
          - name: admin
            key: ${{APISIX_ADMIN_KEY}}
            role: admin
        # Only from inside the pod. Reach it with `kubectl port-forward`.
        allow_admin:
          - 127.0.0.0/24
        admin_listen:
          ip: 0.0.0.0
          port: 9180
      etcd:
        host:
          - http://windops-etcd.windops-system.svc.cluster.local:2379
        prefix: /apisix
        timeout: 30
