apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-gateway-config
  labels:
    app.kubernetes.io/name: windops-gateway
data:
  config.yaml: |
    apisix:
      node_listen: 9080
      enable_ipv6: false
      enable_control: true
      control:
        ip: 127.0.0.1
        port: 9090
      status:
        ip: 0.0.0.0
        port: 7085
      ssl:
        enable: false
    nginx_config:
      worker_processes: 1
      error_log_level: warn
    deployment:
      role: traditional
      role_traditional:
        config_provider: etcd
      admin:
        admin_key_required: true
        admin_key:
          - name: admin
            key: ${{APISIX_ADMIN_KEY}}
            role: admin
        # Only from inside the pod. Reach it with `kubectl port-forward`.
        allow_admin:
          - 127.0.0.0/24
        admin_listen:
          ip: 0.0.0.0
          port: 9180
      etcd:
        host:
          - http://windops-etcd.windops-system.svc.cluster.local:2379
        prefix: /apisix
        timeout: 30
