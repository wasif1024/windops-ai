# Exposes only the HTTPS proxy port (API-001). The Admin, status and control ports stay inside the pod.
apiVersion: v1
kind: Service
metadata:
  name: windops-gateway
  labels:
    app.kubernetes.io/name: windops-gateway
    app.kubernetes.io/part-of: windops
spec:
  selector:
    app.kubernetes.io/name: windops-gateway
  ports:
    - name: https
      port: 443
      targetPort: https
