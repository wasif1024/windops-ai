apiVersion: apps/v1
kind: Deployment
metadata:
  name: windops-agent-runtime
  labels:
    app.kubernetes.io/name: windops-agent-runtime
    app.kubernetes.io/part-of: windops
spec:
  # Workers, so one can fail without losing a run (ARC-006, ARC-007). The local overlay runs one,
  # and runtime-check scales it to two to prove a takeover.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-agent-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-agent-runtime
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # Longer than WINDOPS_SHUTDOWN_GRACE_SECONDS, so calls can finish first. Its runs are handed
      # back at once, so another replica takes them without waiting for their leases.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: windops-agent-runtime:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: windops-agent-runtime-config
            # Settings for every workload, from .env through make config. Last, so they win.
            - configMapRef:
                name: windops-settings
          env:
            - name: WINDOPS_TLS_DIR
              value: /var/run/windops/tls
            - name: WINDOPS_IDENTITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: windops-internal-identity
                  key: signing-key
            - name: WINDOPS_DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: windops-agent-runtime-database
                  key: host
            - name: WINDOPS_DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: windops-agent-runtime-database
                  key: port
            - name: WINDOPS_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: windops-agent-runtime-database
                  key: database
            - name: WINDOPS_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: windops-agent-runtime-database
                  key: username
            - name: WINDOPS_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windops-agent-runtime-database
                  key: password
            - name: WINDOPS_EVENTS_URL
              valueFrom:
                secretKeyRef:
                  name: windops-agent-runtime-events
                  key: url
            - name: WINDOPS_EVENTS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: windops-agent-runtime-events
                  key: username
            - name: WINDOPS_EVENTS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windops-agent-runtime-events
                  key: password
          # Not a gRPC probe, because the kubelet has no client certificate to present.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /var/run/windops/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # Read at each call, so a replaced key is picked up without a restart.
            - name: anthropic-key
              mountPath: /var/run/windops/secrets/anthropic
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: windops-agent-runtime-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        # Optional: without a key the runtime runs, and a run that needs Claude fails, saying so.
        - name: anthropic-key
          secret:
            secretName: windops-anthropic-api-key
            optional: true
            defaultMode: 0440
