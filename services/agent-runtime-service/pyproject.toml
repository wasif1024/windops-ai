[project]
name = "windops-agent-runtime"
version = "0.1.0"
description = "WindOps agent runtime: agent runs as queued jobs, on worker replicas"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # The official MCP SDK, on its 1.x line, as the servers use it (ADR 0014).
    "mcp>=1.30.0,<2",
    # Pinned exactly, as confirmed by make vendor-check (ADR 0015).
    "deepagents==0.7.32",
    "langgraph==1.2.19",
    "langgraph-checkpoint==4.3.1",
    "windops-auth",
    "windops-claude",
    "windops-contracts",
    "windops-events",
    "windops-grpc",
    "windops-migrations",
    "windops-observability",
    "windops-outbox",
    "windops-resilience",
]

[tool.uv.sources]
windops-auth = { workspace = true }
windops-claude = { workspace = true }
windops-contracts = { workspace = true }
windops-events = { workspace = true }
windops-grpc = { workspace = true }
windops-migrations = { workspace = true }
windops-observability = { workspace = true }
windops-outbox = { workspace = true }
windops-resilience = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_agent_runtime"]
