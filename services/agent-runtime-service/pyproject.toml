[project]
name = "windops-agent-runtime"
version = "0.1.0"
description = "WindOps agent runtime: agent runs as queued jobs, on worker replicas"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "windops-auth",
    "windops-claude",
    "windops-contracts",
    "windops-events",
    "windops-grpc",
    "windops-migrations",
    "windops-observability",
    "windops-outbox",
]

[tool.uv.sources]
windops-auth = { workspace = true }
windops-claude = { workspace = true }
windops-contracts = { workspace = true }
windops-events = { workspace = true }
windops-grpc = { workspace = true }
windops-migrations = { workspace = true }
windops-observability = { workspace = true }
windops-outbox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_agent_runtime"]
