[project]
name = "windops-agent-sandbox"
version = "0.1.0"
description = "WindOps Agent Sandbox Adapter: registered analysis tasks, run in LangSmith Sandbox"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "certifi>=2025.1.31",
    "jsonschema>=4.26.0",
    # Pinned exactly, as confirmed by make vendor-check (ADR 0015).
    "langsmith[sandbox]==0.14.17",
    "pyyaml>=6.0.2",
    "windops-auth",
    "windops-contracts",
    "windops-grpc",
    "windops-observability",
    "windops-resilience",
]

[tool.uv.sources]
windops-auth = { workspace = true }
windops-contracts = { workspace = true }
windops-grpc = { workspace = true }
windops-observability = { workspace = true }
windops-resilience = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_agent_sandbox"]
