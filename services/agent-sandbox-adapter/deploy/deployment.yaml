apiVersion: apps/v1
kind: Deployment
metadata:
  name: windops-agent-sandbox-adapter
  labels:
    app.kubernetes.io/name: windops-agent-sandbox-adapter
    app.kubernetes.io/part-of: windops
spec:
  # Stateless: each task gets a sandbox of its own, deleted after it (ADR 0024).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-agent-sandbox-adapter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-agent-sandbox-adapter
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # Longer than WINDOPS_SHUTDOWN_GRACE_SECONDS, so a task in progress can finish first.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-sandbox-adapter
          image: windops-agent-sandbox-adapter:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: windops-agent-sandbox-adapter-config
            # Settings for every workload, from .env through make config. Last, so they win.
            - configMapRef:
                name: windops-settings
          env:
            - name: WINDOPS_TLS_DIR
              value: /var/run/windops/tls
            - name: WINDOPS_IDENTITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: windops-internal-identity
                  key: signing-key
          # Not a gRPC probe, because the kubelet has no client certificate to present.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /var/run/windops/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
            # The key creates sandboxes; it never enters one (SBX-002).
            - name: langsmith-key
              mountPath: /var/run/windops/secrets/langsmith
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: windops-agent-sandbox-adapter-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        # Optional: without a key the adapter runs, and every task is unavailable.
        - name: langsmith-key
          secret:
            secretName: windops-langsmith-api-key
            optional: true
            defaultMode: 0440
