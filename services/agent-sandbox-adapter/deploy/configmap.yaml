apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-agent-sandbox-adapter-config
  labels:
    app.kubernetes.io/name: windops-agent-sandbox-adapter
    app.kubernetes.io/part-of: windops
# Environment-wide values, such as the release and addresses, are in windops-settings (make config).
data:
  WINDOPS_GRPC_PORT: "50051"
  WINDOPS_HTTP_PORT: "8080"
  WINDOPS_SHUTDOWN_GRACE_SECONDS: "20"
  # Sandboxes each replica runs at once, so a burst cannot exhaust the Sandbox's quota.
  WINDOPS_SANDBOX_CONCURRENCY: "2"
  WINDOPS_SANDBOX_TASKS: /app/tasks
  # Nothing here is traced: the Agent Runtime records each task in its run's trace (SBX-003).
  LANGSMITH_TRACING: "false"
