apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-sample-responder-config
  labels:
    app.kubernetes.io/name: windops-sample-responder
    app.kubernetes.io/part-of: windops
# Environment-wide values, such as the release and addresses, are in windops-settings (make config).
data:
  WINDOPS_GRPC_PORT: "50051"
  WINDOPS_HTTP_PORT: "8080"
  WINDOPS_SHUTDOWN_GRACE_SECONDS: "20"
