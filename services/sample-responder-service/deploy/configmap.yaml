apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-sample-responder-config
  labels:
    app.kubernetes.io/name: windops-sample-responder
    app.kubernetes.io/part-of: windops
data:
  WINDOPS_ENVIRONMENT: local
  WINDOPS_VERSION: local
  WINDOPS_LOG_LEVEL: INFO
  WINDOPS_GRPC_PORT: "50051"
  WINDOPS_HTTP_PORT: "8080"
  WINDOPS_OTLP_ENDPOINT: http://windops-otel-collector.windops-observability.svc.cluster.local:4318
  WINDOPS_SHUTDOWN_GRACE_SECONDS: "20"
