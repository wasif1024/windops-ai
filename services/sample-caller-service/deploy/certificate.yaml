# This service's identity for mutual TLS (GRP-005).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: windops-sample-caller-tls
  labels:
    app.kubernetes.io/name: windops-sample-caller
    app.kubernetes.io/part-of: windops
spec:
  secretName: windops-sample-caller-tls
  commonName: windops-sample-caller
  dnsNames:
    - windops-sample-caller
    - windops-sample-caller.windops-application
    - windops-sample-caller.windops-application.svc
    - windops-sample-caller.windops-application.svc.cluster.local
  duration: 720h
  renewBefore: 168h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  issuerRef:
    name: windops-internal
    kind: ClusterIssuer
    group: cert-manager.io
