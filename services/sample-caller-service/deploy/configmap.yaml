apiVersion: v1
kind: ConfigMap
metadata:
  name: windops-sample-caller-config
  labels:
    app.kubernetes.io/name: windops-sample-caller
    app.kubernetes.io/part-of: windops
# Environment-wide values, such as the release and addresses, are in windops-settings (make config).
data:
  WINDOPS_GRPC_PORT: "50051"
  WINDOPS_HTTP_PORT: "8080"
  WINDOPS_SHUTDOWN_GRACE_SECONDS: "20"
  WINDOPS_SAMPLE_RESPONDER_ADDRESS: dns:///windops-sample-responder.windops-application.svc.cluster.local:50051
