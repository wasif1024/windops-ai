[project]
name = "windops-sample-caller"
version = "0.1.0"
description = "WindOps sample-caller service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "opentelemetry-api>=1.45.2",
    "windops-contracts",
    "windops-grpc",
    "windops-observability",
    "windops-resilience",
]

[tool.uv.sources]
windops-grpc = { workspace = true }
windops-contracts = { workspace = true }
windops-observability = { workspace = true }
windops-resilience = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_sample_caller"]
