[project]
name = "windops-web-bff"
version = "0.1.0"
description = "WindOps Web BFF"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.15.1",
    "windops-auth",
    "windops-cache",
    "windops-contracts",
    "windops-grpc",
    "windops-observability",
    "windops-resilience",
]

[tool.uv.sources]
windops-auth = { workspace = true }
windops-cache = { workspace = true }
windops-contracts = { workspace = true }
windops-grpc = { workspace = true }
windops-observability = { workspace = true }
windops-resilience = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_web_bff"]
