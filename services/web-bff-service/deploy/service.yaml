apiVersion: v1
kind: Service
metadata:
  name: windops-web-bff
  labels:
    app.kubernetes.io/name: windops-web-bff
    app.kubernetes.io/part-of: windops
spec:
  # Headless, so gRPC clients can spread calls across replicas (K8S-004).
  clusterIP: None
  selector:
    app.kubernetes.io/name: windops-web-bff
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
    # The API, over TLS. The gateway checks its certificate.
    - name: https
      port: 8443
      targetPort: https
