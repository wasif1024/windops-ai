apiVersion: apps/v1
kind: Deployment
metadata:
  name: windops-web-bff
  labels:
    app.kubernetes.io/name: windops-web-bff
    app.kubernetes.io/part-of: windops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-web-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-web-bff
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # Longer than WINDOPS_SHUTDOWN_GRACE_SECONDS, so calls can finish first.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web-bff
          image: windops-web-bff:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: windops-web-bff-config
          env:
            - name: WINDOPS_TLS_DIR
              value: /var/run/windops/tls
            - name: WINDOPS_IDENTITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: windops-internal-identity
                  key: signing-key
            # Tokens must come from this issuer, the fixed public address, for this audience.
            - name: WINDOPS_OIDC_ISSUER
              value: https://localhost:9443/auth/realms/windops
            - name: WINDOPS_OIDC_AUDIENCE
              value: windops-api
            # The keys are read from Keycloak inside the cluster, over HTTPS.
            - name: WINDOPS_OIDC_JWKS_URL
              value: https://windops-keycloak.windops-system.svc.cluster.local:8443/auth/realms/windops/protocol/openid-connect/certs
            - name: WINDOPS_TENANT_ADDRESS
              value: windops-tenant.windops-system.svc.cluster.local:50051
            - name: WINDOPS_CACHE_HOST
              valueFrom:
                secretKeyRef:
                  name: windops-web-bff-cache
                  key: host
            - name: WINDOPS_CACHE_PORT
              valueFrom:
                secretKeyRef:
                  name: windops-web-bff-cache
                  key: port
            - name: WINDOPS_CACHE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: windops-web-bff-cache
                  key: username
            - name: WINDOPS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windops-web-bff-cache
                  key: password
          # Not a gRPC probe, because the kubelet has no client certificate to present.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          # Starting values. Replace them with measured figures (SRS 11).
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /var/run/windops/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: windops-web-bff-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
