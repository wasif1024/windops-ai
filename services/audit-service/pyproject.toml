[project]
name = "windops-audit"
version = "0.1.0"
description = "WindOps audit service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "windops-contracts",
    "windops-events",
    "windops-grpc",
    "windops-migrations",
    "windops-outbox",
]

[tool.uv.sources]
windops-contracts = { workspace = true }
windops-events = { workspace = true }
windops-grpc = { workspace = true }
windops-outbox = { workspace = true }
windops-migrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_audit"]
