apiVersion: v1
kind: Service
metadata:
  name: windops-investigation
  labels:
    app.kubernetes.io/name: windops-investigation
    app.kubernetes.io/part-of: windops
spec:
  # Headless, so gRPC clients can spread calls across replicas (K8S-004).
  clusterIP: None
  selector:
    app.kubernetes.io/name: windops-investigation
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
