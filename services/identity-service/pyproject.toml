[project]
name = "windops-identity"
version = "0.1.0"
description = "WindOps identity service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    "windops-auth",
    "windops-contracts",
    "windops-events",
    "windops-grpc",
    "windops-migrations",
    "windops-observability",
    "windops-outbox",
    "windops-resilience",
]

[tool.uv.sources]
windops-auth = { workspace = true }
windops-contracts = { workspace = true }
windops-events = { workspace = true }
windops-grpc = { workspace = true }
windops-migrations = { workspace = true }
windops-observability = { workspace = true }
windops-outbox = { workspace = true }
windops-resilience = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_identity"]
