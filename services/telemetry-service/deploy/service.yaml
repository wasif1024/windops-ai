apiVersion: v1
kind: Service
metadata:
  name: windops-telemetry
  labels:
    app.kubernetes.io/name: windops-telemetry
    app.kubernetes.io/part-of: windops
spec:
  # Headless, so gRPC clients can spread calls across replicas (K8S-004).
  clusterIP: None
  selector:
    app.kubernetes.io/name: windops-telemetry
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
    - name: http
      port: 8080
      targetPort: http
    # The device route, over TLS. The gateway checks its certificate.
    - name: https
      port: 8443
      targetPort: https
