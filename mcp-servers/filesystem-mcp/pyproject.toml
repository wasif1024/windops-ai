[project]
name = "windops-mcp-filesystem"
version = "0.1.0"
description = "Filesystem MCP: read test fixtures and documents, development only (SRS 6.3)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "windops-contracts",
    "windops-mcp",
]

[tool.uv.sources]
windops-contracts = { workspace = true }
windops-mcp = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_mcp_filesystem"]
