apiVersion: v1
kind: Service
metadata:
  name: windops-mcp-filesystem
  labels:
    app.kubernetes.io/name: windops-mcp-filesystem
    app.kubernetes.io/part-of: windops
spec:
  selector:
    app.kubernetes.io/name: windops-mcp-filesystem
  ports:
    # The MCP endpoint, over TLS with client certificates.
    - name: https
      port: 8443
      targetPort: https
    - name: http
      port: 8080
      targetPort: http
