apiVersion: apps/v1
kind: Deployment
metadata:
  name: windops-mcp-windops
  labels:
    app.kubernetes.io/name: windops-mcp-windops
    app.kubernetes.io/part-of: windops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: windops-mcp-windops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: windops-mcp-windops
        app.kubernetes.io/part-of: windops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      # Longer than WINDOPS_SHUTDOWN_GRACE_SECONDS, so calls can finish first.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: windops-mcp-windops:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: windops-mcp-windops-config
            # Settings for every workload, from .env through make config. Last, so they win.
            - configMapRef:
                name: windops-settings
          env:
            - name: WINDOPS_TLS_DIR
              value: /var/run/windops/tls
            - name: WINDOPS_IDENTITY_SECRET
              valueFrom:
                secretKeyRef:
                  name: windops-internal-identity
                  key: signing-key
            - name: WINDOPS_OIDC_ISSUER
              value: $(WINDOPS_PUBLIC_URL)/auth/realms/$(WINDOPS_KEYCLOAK_REALM)
            # The keys are read from Keycloak inside the cluster, over HTTPS.
            - name: WINDOPS_OIDC_JWKS_URL
              value: $(WINDOPS_KEYCLOAK_INTERNAL_URL)/realms/$(WINDOPS_KEYCLOAK_REALM)/protocol/openid-connect/certs
            - name: WINDOPS_CACHE_HOST
              valueFrom:
                secretKeyRef:
                  name: windops-mcp-windops-cache
                  key: host
            - name: WINDOPS_CACHE_PORT
              valueFrom:
                secretKeyRef:
                  name: windops-mcp-windops-cache
                  key: port
            - name: WINDOPS_CACHE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: windops-mcp-windops-cache
                  key: username
            - name: WINDOPS_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windops-mcp-windops-cache
                  key: password
            - name: WINDOPS_EVENTS_URL
              valueFrom:
                secretKeyRef:
                  name: windops-mcp-windops-events
                  key: url
            - name: WINDOPS_EVENTS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: windops-mcp-windops-events
                  key: username
            - name: WINDOPS_EVENTS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windops-mcp-windops-events
                  key: password
          # Health and metrics only, over plain HTTP. The MCP endpoint is on https alone.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /var/run/windops/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: windops-mcp-windops-tls
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
