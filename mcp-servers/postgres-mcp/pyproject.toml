[project]
name = "windops-mcp-postgres"
version = "0.1.0"
description = "PostgreSQL MCP: read-only diagnostics, development only (SRS 6.3)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "windops-contracts",
    "windops-mcp",
    "windops-migrations",
]

[tool.uv.sources]
windops-contracts = { workspace = true }
windops-mcp = { workspace = true }
windops-migrations = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_mcp_postgres"]
