name: PR status

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

# Runs for one pull request must not overlap, or an older run can undo a newer run's label.
concurrency:
  group: pr-status-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-status:
    name: pr-status
    runs-on: ubuntu-24.04
    steps:
      - name: Update the status label and check the pull request can merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REVIEW: ${{ github.event.review.state }}
        run: |
          set -euo pipefail

          # Read the current state, because the event's copy can be out of date by now.
          DRAFT="$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq '.isDraft')"
          TITLE="$(gh pr view "$PR" --repo "$REPO" --json title --jq '.title')"
          labels="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')"

          desired=""
          if [ "$DRAFT" = "true" ]; then
            desired="status: wip"
          elif [ "$EVENT" = "pull_request_review" ]; then
            case "$REVIEW" in
              approved) desired="status: approved" ;;
              changes_requested) desired="status: changes requested" ;;
            esac
          else
            case "$ACTION" in
              opened|reopened|ready_for_review|synchronize) desired="status: ready for review" ;;
            esac
            # Only a draft is a work in progress, so a leftover label is corrected here.
            if [ -z "$desired" ] && grep -qx "status: wip" <<<"$labels"; then
              desired="status: ready for review"
            fi
          fi

          # A pull request from a fork gets a read-only token, so it cannot change labels.
          if [ -n "$desired" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            for label in "status: wip" "status: ready for review" "status: changes requested" "status: approved"; do
              if [ "$label" != "$desired" ]; then
                gh pr edit "$PR" --repo "$REPO" --remove-label "$label" >/dev/null 2>&1 || true
              fi
            done
            gh pr edit "$PR" --repo "$REPO" --add-label "$desired"
            echo "Status: $desired"
          fi

          labels="$(gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name')"
          failed=0
          if [ "$DRAFT" = "true" ]; then
            echo "::error::This pull request is a work in progress. Mark it ready for review."
            failed=1
          fi
          if grep -qx "status: blocked" <<<"$labels"; then
            echo "::error::This pull request is blocked. Remove the status: blocked label first."
            failed=1
          fi
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore)(\([a-z0-9-]+\))?: .+$'
          if ! grep -qE "$pattern" <<<"$TITLE"; then
            echo "::error::The title must follow docs/coding-standards.md, such as feat(telemetry): add ingestion."
            failed=1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error::The title must be at most 72 characters."
            failed=1
          fi
          exit "$failed"
