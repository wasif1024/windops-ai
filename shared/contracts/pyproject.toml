[project]
name = "windops-contracts"
version = "0.1.0"
description = "Python code generated from the Protobuf contracts in shared/protobuf"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio>=1.85.1",
    "protobuf>=7.36.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops"]
