[project]
name = "windops-migrations"
version = "0.1.0"
description = "Run each service's Alembic migrations as a Kubernetes Job (DAT-001, DAT-002)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "azure-identity>=1.23",
    # The public roots Azure Database for PostgreSQL's certificates are checked against.
    "certifi>=2026.10.23",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_migrations"]
