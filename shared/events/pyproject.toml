[project]
name = "windops-events"
version = "0.1.0"
description = "Durable, tenant-carrying JetStream events for WindOps services (SRS 7.6)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "nats-py>=2.16.0",
    "opentelemetry-api>=1.45.2",
    "windops-contracts",
    "windops-resilience",
]

[tool.uv.sources]
windops-contracts = { workspace = true }
windops-resilience = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_events"]
