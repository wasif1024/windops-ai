[project]
name = "windops-mcp"
version = "0.1.0"
description = "The foundation every WindOps MCP server is built on (MCP-001, MCP-003, MCP-004, MCP-005)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx>=0.28.1",
    # The 1.x line: LangChain's MCP adapters, which the agents use, do not take 2.x yet (ADR 0014).
    "mcp>=1.30.0,<2",
    "pydantic>=2.12",
    "pyjwt[crypto]>=2.15.1",
    "windops-auth",
    "windops-cache",
    "windops-contracts",
    "windops-events",
    "windops-grpc",
    "windops-observability",
    "windops-resilience",
    "windops-screening",
]

[tool.uv.sources]
windops-auth = { workspace = true }
windops-cache = { workspace = true }
windops-contracts = { workspace = true }
windops-events = { workspace = true }
windops-grpc = { workspace = true }
windops-observability = { workspace = true }
windops-resilience = { workspace = true }
windops-screening = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_mcp"]
