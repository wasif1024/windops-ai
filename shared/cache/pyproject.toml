[project]
name = "windops-cache"
version = "0.1.0"
description = "Tenant-scoped Redis cache and rate limits for WindOps services (SRS 8.1)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "redis>=8.1.0",
    "windops-resilience",
]

[tool.uv.sources]
windops-resilience = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_cache"]
