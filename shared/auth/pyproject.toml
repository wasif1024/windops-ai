[project]
name = "windops-auth"
version = "0.1.0"
description = "Check a token's level of authentication (SEC-002, SEC-003)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyjwt>=2.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_auth"]
