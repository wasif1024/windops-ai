[project]
name = "windops-observability"
version = "0.1.0"
description = "Structured logs, traces and metrics for WindOps services (SRS 10.2)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_observability"]
