[project]
name = "windops-claude"
version = "0.1.0"
description = "The Claude model policy: versioned models and effort, response checks, caching, history and budgets (LLM-001 to LLM-010)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Pinned exactly, as confirmed by make vendor-check (ADR 0015). A newer release is taken only
    # after the vendor check passes on it.
    "anthropic==2.4.0",
    "langchain-anthropic==1.7.10",
    "langchain-core==1.7.5",
    "pydantic>=2.12",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_claude"]
