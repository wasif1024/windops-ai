syntax = "proto3";
package windops.audit.v1;

import "google/protobuf/timestamp.proto";

// Read-only. Records arrive only as events, so nothing can change one through this service.
// Both calls need audit.read from the Authorization Service, in the caller's own tenant.
service AuditService {
  rpc ListAuditRecords(ListAuditRecordsRequest) returns (ListAuditRecordsResponse);
  rpc VerifyAuditChain(VerifyAuditChainRequest) returns (AuditChainVerification);
}

// The tenant comes from the caller's verified identity (GRP-004). Reading needs audit.read.
message ListAuditRecordsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // Only records with this action, such as "authorization.denied". Empty means every record.
  string action = 3;
  // The filters below narrow the records further, each when set, and all together (M11.6).
  // Only records whose action starts with this, such as "knowledge_document.".
  string action_prefix = 4;
  // Only records of this actor: a user, an agent or a service ID.
  string actor_id = 5;
  // Only records about this kind of resource, and this one.
  string resource_type = 6;
  string resource_id = 7;
  // "succeeded", "denied" or "failed".
  string outcome = 8;
  // Only records of one request, followed across services.
  string correlation_id = 9;
  // Only records from this service.
  string producer = 10;
  // When it happened: from, inclusive, to, exclusive.
  google.protobuf.Timestamp from_time = 11;
  google.protobuf.Timestamp to_time = 12;
  // Newest first. The page token then leads to older records.
  bool newest_first = 13;
}

message ListAuditRecordsResponse {
  repeated AuditRecord records = 1;
  string next_page_token = 2;
}

message VerifyAuditChainRequest {}

message AuditChainVerification {
  bool valid = 1;
  int64 records_checked = 2;
  // The first record that does not match, when `valid` is false.
  int64 first_invalid_sequence = 3;
}

message AuditRecord {
  int64 sequence = 1;
  string event_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
  google.protobuf.Timestamp recorded_at = 4;
  string producer = 5;
  string action = 6;
  string actor_type = 7;
  string actor_id = 8;
  string on_behalf_of = 9;
  string resource_type = 10;
  string resource_id = 11;
  string outcome = 12;
  string correlation_id = 13;
  string previous_hash = 14;
  string record_hash = 15;
}
