syntax = "proto3";

package windops.fault_detection.v1;

import "google/protobuf/timestamp.proto";

// Deterministic fault rules, and what they find in a turbine's recent telemetry and alarms
// (FR-FLT-001, FR-FLT-002, FR-FLT-005).
//
// A rule is a kind, its parameters and its severity levels, as JSON. Every change is a new
// version, kept for ever with who made it, when and why, and its content hash. An old version
// never changes. A finding's severity comes only from its rule's levels: nothing else, and never a
// model, sets or raises it.
//
// The tenant comes from the caller's verified identity (GRP-004). Reading rules needs
// policy.read. Changing one needs policy.manage and a recent second factor (SEC-003), so only a
// person can, never an agent or a service. Each change is audited, and may be retried with the
// same idempotency_key (GRP-007). A tenant starts with the default library, as version 1 of each.
service FaultRuleService {
  rpc ListFaultRules(ListFaultRulesRequest) returns (ListFaultRulesResponse);
  // With every version.
  rpc GetFaultRule(GetFaultRuleRequest) returns (GetFaultRuleResponse);
  // A new rule, or a new version of one. Refused unless the definition can be evaluated exactly.
  rpc PublishFaultRuleVersion(PublishFaultRuleVersionRequest) returns (PublishFaultRuleVersionResponse);
  rpc SetFaultRuleEnabled(SetFaultRuleEnabledRequest) returns (SetFaultRuleEnabledResponse);
  // Runs every enabled rule against a turbine's recent telemetry and alarms, and records nothing.
  // The caller must be able to read the turbine, its telemetry and its alarms.
  rpc EvaluateTurbine(EvaluateTurbineRequest) returns (EvaluateTurbineResponse);

  // What the detector found (FR-FLT-003): open ones by default, most severe and newest first.
  // Each holds the exact rule version it used and the telemetry snapshot it saw. Needs
  // investigation.read for the turbine's wind farm or the turbine.
  rpc ListDetections(ListDetectionsRequest) returns (ListDetectionsResponse);
  rpc GetDetection(GetDetectionRequest) returns (GetDetectionResponse);
}

message FaultRuleVersion {
  string rule_id = 1;
  int64 version = 2;
  // "threshold", "residual", "rolling_zscore", "alarm_correlation" or "data_gap".
  string kind = 3;
  // {"kind": ..., "parameters": {...}, "levels": [{"at": ..., "severity": ...}]}, canonical.
  string definition_json = 4;
  // sha256 of "windops-fault-rule-v1|<rule_id>|<version>|<definition_json>".
  string content_hash = 5;
  // A user, or "system" for the default library.
  string created_by = 6;
  google.protobuf.Timestamp created_at = 7;
  string reason = 8;
}

message FaultRule {
  // Lowercase letters, digits and hyphens, such as "gearbox-oil-residual".
  string rule_id = 1;
  string name = 2;
  string description = 3;
  bool enabled = 4;
  FaultRuleVersion current = 5;
}

message ListFaultRulesRequest {}

message ListFaultRulesResponse {
  repeated FaultRule rules = 1;
  // The default library the tenant started from, such as "fault-rules-1".
  string library = 2;
}

message GetFaultRuleRequest {
  string rule_id = 1;
}

message GetFaultRuleResponse {
  FaultRule rule = 1;
  // Oldest first.
  repeated FaultRuleVersion versions = 2;
}

message PublishFaultRuleVersionRequest {
  string rule_id = 1;
  string name = 2;
  string description = 3;
  string definition_json = 4;
  // Why, for whoever reviews it. Required.
  string reason = 5;
  // The version this replaces, or 0 for a new rule, so two people cannot overwrite each other.
  int64 expected_version = 6;
  string idempotency_key = 7;
}

message PublishFaultRuleVersionResponse {
  FaultRule rule = 1;
}

message SetFaultRuleEnabledRequest {
  string rule_id = 1;
  bool enabled = 2;
  string reason = 3;
  string idempotency_key = 4;
}

message SetFaultRuleEnabledResponse {
  FaultRule rule = 1;
}

message EvaluateTurbineRequest {
  string turbine_id = 1;
  // The end of the window. Empty means now.
  google.protobuf.Timestamp at = 2;
}

message Finding {
  string rule_id = 1;
  int64 version = 2;
  string kind = 3;
  // "low", "medium", "high" or "critical", from the rule's levels.
  string severity = 4;
  // The figure the severity came from, in the rule's own units.
  double amount = 5;
  string summary = 6;
  // Every value the finding rests on.
  string observed_json = 7;
  google.protobuf.Timestamp since = 8;
}

message EvaluateTurbineResponse {
  string turbine_id = 1;
  google.protobuf.Timestamp window_start = 2;
  google.protobuf.Timestamp window_end = 3;
  repeated Finding findings = 4;
  // How many samples and alarms the rules saw.
  int64 sample_count = 5;
  int64 alarm_count = 6;
}

// One finding by one rule version, at one severity, on one turbine. It opens when the detector's
// rule finds it, and closes when the rule no longer does, or finds it at another severity or under
// a newer version, which is a detection of its own.
message Detection {
  string detection_id = 1;
  string turbine_id = 2;
  string rule_id = 3;
  int64 rule_version = 4;
  // The version's content hash, so the exact rule can be shown to be the one used.
  string rule_content_hash = 5;
  string kind = 6;
  string severity = 7;
  double amount = 8;
  string summary = 9;
  // Every value the finding rests on.
  string observed_json = 10;
  google.protobuf.Timestamp since = 11;
  google.protobuf.Timestamp detected_at = 12;
  // When the rule last found it.
  google.protobuf.Timestamp last_seen_at = 13;
  // The telemetry the rule saw, frozen (FR-TEL-006).
  google.protobuf.Timestamp window_start = 14;
  google.protobuf.Timestamp window_end = 15;
  string telemetry_snapshot_id = 16;
  string telemetry_snapshot_hash = 17;
  // The alarms the rule saw.
  repeated string alarm_ids = 18;
  // "open" or "closed".
  string state = 19;
  google.protobuf.Timestamp closed_at = 20;
  // "cleared", or "replaced" by a detection at another severity or rule version.
  string closed_reason = 21;
}

message ListDetectionsRequest {
  string turbine_id = 1;
  // "open", "closed", or empty for open.
  string state = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListDetectionsResponse {
  repeated Detection detections = 1;
  string next_page_token = 2;
}

message GetDetectionRequest {
  string detection_id = 1;
}

message GetDetectionResponse {
  Detection detection = 1;
}
