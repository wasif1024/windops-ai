syntax = "proto3";
package windops.identity.v1;

import "google/protobuf/timestamp.proto";

// Manages a tenant's users in Keycloak, which holds their credentials and sessions (SEC-006).
// Every call needs users.manage from the Authorization Service, and every change a recent second
// factor (SEC-003). The caller's tenant comes from their verified identity (GRP-004).
//
// For target_tenant_id below: empty means the caller's own tenant. Only a Platform Administrator
// may name another. A member_id is always checked against that tenant, so another tenant's users
// look exactly like users who do not exist.
service IdentityService {
  // Returns a temporary password once, which the user must change at their first login.
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Also ends every session the user has.
  rpc DisableUser(DisableUserRequest) returns (DisableUserResponse);
  rpc ReactivateUser(ReactivateUserRequest) returns (ReactivateUserResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSessions(RevokeSessionsRequest) returns (RevokeSessionsResponse);
  rpc GetMfaStatus(GetMfaStatusRequest) returns (GetMfaStatusResponse);

  // A tenant's Keycloak organization, for the Tenant Service. Both need tenant.manage and a recent
  // second factor. A disabled organization's users get no tenant_id, so the gateway refuses them.
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc SetOrganizationEnabled(SetOrganizationEnabledRequest) returns (SetOrganizationEnabledResponse);

  // Swap the caller's own access token for a short-lived one for one allowed service, such as
  // windops-agent-runtime, so an agent can act for the user without their login (SEC-008).
  // Keycloak checks the token is the caller's own, before the exchange.
  rpc ExchangeToken(ExchangeTokenRequest) returns (ExchangeTokenResponse);

  // Agent identities (SRS 9.2, SEC-008 to SEC-010, ADR 0019). A delegation lets a run's agents act
  // for one principal, in one tenant, for a bounded time:
  // - for the user who started an investigation, proven by their own current Keycloak token;
  // - or for the tenant's fault-investigator principal, when a detection started it.
  // Only Web BFF and the Investigation Service may start one, and only the Agent Runtime may
  // mint its tokens. Each token is for one agent, one MCP server and named tools, and lasts 120
  // seconds. It names the principal as its subject and the agent in "act" (RFC 8693), so every
  // tool call is audited as the agent, on the principal's behalf.
  rpc StartDelegation(StartDelegationRequest) returns (StartDelegationResponse);
  rpc IssueAgentToken(IssueAgentTokenRequest) returns (IssueAgentTokenResponse);
  // Ends it, so no further token is minted. Ending it twice changes nothing.
  rpc EndDelegation(EndDelegationRequest) returns (EndDelegationResponse);
  // The public keys agent tokens are signed with, as a JWKS, for the MCP servers.
  rpc GetAgentTokenKeys(GetAgentTokenKeysRequest) returns (GetAgentTokenKeysResponse);
}

message User {
  string member_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  bool enabled = 5;
  google.protobuf.Timestamp created_at = 6;
}

message Session {
  string session_id = 1;
  string ip_address = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp last_access_at = 4;
  // The Keycloak clients the session signed in to, such as "windops-web".
  repeated string clients = 5;
}

message CreateUserRequest {
  string target_tenant_id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  // A retry returns the same user, but never the password again (GRP-007).
  string idempotency_key = 5;
}

message CreateUserResponse {
  User user = 1;
  // Only in the first answer. It is never stored or logged.
  string temporary_password = 2;
  // True when this answers a retry, so there is no password to show.
  bool already_created = 3;
}

message GetUserRequest {
  string target_tenant_id = 1;
  string member_id = 2;
}

message GetUserResponse {
  User user = 1;
}

message ListUsersRequest {
  string target_tenant_id = 1;
  // From 1 to 200. Zero means 50.
  int32 page_size = 2;
  string page_token = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_page_token = 2;
}

// Disabling, reactivating and revoking sessions end in the same state however often they run, so a
// retry is safe. The key is accepted for that reason, and a repeat is not audited again (GRP-007).
message DisableUserRequest {
  string target_tenant_id = 1;
  string member_id = 2;
  string idempotency_key = 3;
}

message DisableUserResponse {
  User user = 1;
}

message ReactivateUserRequest {
  string target_tenant_id = 1;
  string member_id = 2;
  string idempotency_key = 3;
}

message ReactivateUserResponse {
  User user = 1;
}

message ListSessionsRequest {
  string target_tenant_id = 1;
  string member_id = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionsRequest {
  string target_tenant_id = 1;
  string member_id = 2;
  string idempotency_key = 3;
}

message RevokeSessionsResponse {
  int32 sessions_ended = 1;
}

message GetMfaStatusRequest {
  string target_tenant_id = 1;
  string member_id = 2;
}

message GetMfaStatusResponse {
  bool otp_configured = 1;
  bool recovery_codes_configured = 2;
  // True while Keycloak will ask the user to set up a second factor at their next login.
  bool setup_required = 3;
}

// Creating an existing organization with the same name returns it, so a retry is safe.
message CreateOrganizationRequest {
  // The tenant ID, which becomes the organization's alias and every token's tenant_id.
  string target_tenant_id = 1;
  string name = 2;
  string idempotency_key = 3;
}

message CreateOrganizationResponse {
  string organization_id = 1;
  // False when it already existed.
  bool created = 2;
}

message SetOrganizationEnabledRequest {
  string target_tenant_id = 1;
  bool enabled = 2;
  string idempotency_key = 3;
}

message SetOrganizationEnabledResponse {
  bool enabled = 1;
}

message ExchangeTokenRequest {
  // The caller's own Keycloak access token. It is never stored or logged.
  string subject_token = 1;
  // The one service the new token is for. Only allowed services may be named.
  string audience = 2;
  // For an MCP server, the tools the token may call, each as its scope, such as
  // "mcp.documentation.search_documents". At least one, and only that server's own.
  repeated string scopes = 3;
}

message ExchangeTokenResponse {
  string access_token = 1;
  int32 expires_in_seconds = 2;
  string audience = 3;
  // The tool scopes the token carries.
  repeated string scopes = 4;
}

message Delegation {
  // "dlg_" and 20 lowercase letters and digits.
  string delegation_id = 1;
  // "user:<Keycloak ID>", or "service:fault-investigator".
  string principal = 2;
  string case_id = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp ended_at = 6;
  string end_reason = 7;
  // The service that started it.
  string started_by = 8;
}

message StartDelegationRequest {
  string case_id = 1;
  // For a user-started investigation: the user's own current Keycloak access token, which proves
  // they are signed in now. It is introspected, then dropped: never stored or logged. Empty for
  // the tenant's fault-investigator, which only the Investigation Service, acting as itself, may
  // ask for.
  string subject_token = 2;
  // At most 4 hours, and 1 hour if not given.
  int32 ttl_seconds = 3;
  // The same key with the same request returns the same delegation (GRP-007).
  string idempotency_key = 4;
}

message StartDelegationResponse {
  Delegation delegation = 1;
}

message IssueAgentTokenRequest {
  string delegation_id = 1;
  // The agent acting, such as "reliability-engineer".
  string agent = 2;
  // One MCP server, such as "windops-mcp-documentation".
  string audience = 3;
  // Its tools, each as its scope. At least one.
  repeated string scopes = 4;
}

message IssueAgentTokenResponse {
  // Never put in a prompt or a tool result (SEC-008).
  string access_token = 1;
  int32 expires_in_seconds = 2;
  string audience = 3;
  repeated string scopes = 4;
  // "agent:<name>", as the token's "act" names it.
  string actor = 5;
  string principal = 6;
}

message EndDelegationRequest {
  string delegation_id = 1;
  string reason = 2;
  // Ending twice changes nothing, so a retry is always safe (GRP-007).
  string idempotency_key = 3;
}

message EndDelegationResponse {
  Delegation delegation = 1;
}

message GetAgentTokenKeysRequest {}

message GetAgentTokenKeysResponse {
  // The issuer agent tokens name.
  string issuer = 1;
  // {"keys": [...]}, public keys only.
  string jwks_json = 2;
}
