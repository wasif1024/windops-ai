syntax = "proto3";
package windops.sample.v1;

// A small contract that proves services can call each other. It holds no business logic.
service SampleResponderService {
  rpc Echo(EchoRequest) returns (EchoResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
  string tenant_id = 2;
}
