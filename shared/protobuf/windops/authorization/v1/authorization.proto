syntax = "proto3";
package windops.authorization.v1;

import "google/protobuf/timestamp.proto";

// Decides what a user may do, and keeps their roles (SEC-006). Anything not granted is denied.
// The user and their tenant come from the caller's verified identity, never from a request (RBAC-001).
service AuthorizationService {
  // Whether the current user may use a permission, in a scope. Every denial is audited.
  rpc Check(CheckRequest) returns (CheckResponse);
  // The caller's own roles and permissions in their tenant, so a screen can show only what they may use.
  // It decides nothing: every operation still calls Check.
  rpc ListMyPermissions(ListMyPermissionsRequest) returns (ListMyPermissionsResponse);

  // Needs roles.manage and a recent second factor (SEC-003).
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
  // Needs roles.manage and a recent second factor. A grant is ended, never deleted.
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  // Needs roles.manage.
  rpc ListRoleGrants(ListRoleGrantsRequest) returns (ListRoleGrantsResponse);

  // Needs permissions.manage.
  rpc GetRolePermissions(GetRolePermissionsRequest) returns (GetRolePermissionsResponse);
  // Needs permissions.manage and a recent second factor. Replaces the role's permissions in one tenant.
  rpc SetRolePermissions(SetRolePermissionsRequest) returns (SetRolePermissionsResponse);

  // Approval policy changes (RBAC-007): granting or revoking a role that holds maintenance.approve,
  // or giving or taking that permission from a role, is not applied at once. GrantRole,
  // RevokeRole and SetRolePermissions answer with a pending change instead, which a second Tenant
  // Administrator confirms, never its proposer. When the tenant has no other, the escalation is a
  // Platform Administrator, signed in to the platform tenant. Confirming needs the same permission
  // as the change, or the Platform Administrator role, and a recent second factor (SEC-003). A
  // pending change expires after 7 days.
  //
  // The tenant's pending changes, newest first. A Platform Administrator naming no tenant sees the
  // escalated ones in every tenant.
  rpc ListPendingChanges(ListPendingChangesRequest) returns (ListPendingChangesResponse);
  // Applies a pending change, as its proposer's, confirmed by the caller.
  rpc ConfirmChange(ConfirmChangeRequest) returns (ConfirmChangeResponse);
  // Withdraws it (its proposer) or refuses it (one who could confirm it), with a reason.
  rpc DeclineChange(DeclineChangeRequest) returns (DeclineChangeResponse);

  // A Platform Administrator's time-limited, reasoned access to one tenant's data (RBAC-003).
  rpc StartBreakGlass(StartBreakGlassRequest) returns (StartBreakGlassResponse);
  rpc EndBreakGlass(EndBreakGlassRequest) returns (EndBreakGlassResponse);
  // The caller's own break-glass grants that are still active, in every tenant, soonest to expire
  // first. It names no one else's.
  rpc ListMyBreakGlassGrants(ListMyBreakGlassGrantsRequest) returns (ListMyBreakGlassGrantsResponse);
}

// Where something applies (RBAC-002). Both empty means the whole tenant.
message Scope {
  string wind_farm_id = 1;
  string turbine_id = 2;
}

message CheckRequest {
  // For example "alarm.acknowledge", from SRS 3.2.
  string permission = 1;
  // The resource's wind farm and turbine. A wind farm grant covers a turbine only when both are given.
  Scope scope = 2;
  // The tenant the resource belongs to. Empty for the caller's own, which comes from their verified
  // identity (GRP-004). Only a Platform Administrator may name another, and that is checked.
  string target_tenant_id = 3;
  // For a decision on a request made at this time, such as an approval (RBAC-006): what the
  // caller changed themselves since then cannot make them eligible. Roles they granted after it
  // are left out, and so are their changes to role permissions after it. Unset for any other
  // check.
  google.protobuf.Timestamp eligible_since = 4;
}

message CheckResponse {
  bool allowed = 1;
  // Why, in words a log can hold. It never names another user's grants.
  string reason = 2;
  // True when only a break-glass grant allowed it, which is also audited (RBAC-003).
  bool break_glass = 3;
  // The version of the tenant's role permissions it was decided on: 0 for the SRS 3.2
  // defaults, then one more for each change (RBAC-005).
  int64 permissions_version = 4;
}

// For target_tenant_id in every request below: empty means the caller's own tenant, from their
// verified identity. Naming another is allowed only for a Platform Administrator.
// A retry with the same idempotency_key returns the first answer, and changes nothing (GRP-007).
message GrantRoleRequest {
  string target_tenant_id = 1;
  // The user receiving the role, not the caller.
  string grantee_id = 2;
  // For example "control-room-operator".
  string role = 3;
  Scope scope = 4;
  string idempotency_key = 5;
}

message RevokeRoleRequest {
  string target_tenant_id = 1;
  string grant_id = 2;
  string idempotency_key = 3;
}

message ListRoleGrantsRequest {
  string target_tenant_id = 1;
  // Empty for every user in the tenant.
  string grantee_id = 2;
  // Ended grants stay, so an approval can be checked against the roles held at the time (RBAC-005).
  bool include_revoked = 3;
}

message ListRoleGrantsResponse {
  repeated RoleGrant grants = 1;
}

message RoleGrant {
  string grant_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string role = 4;
  Scope scope = 5;
  string granted_by = 6;
  google.protobuf.Timestamp granted_at = 7;
  // Empty while the grant is active.
  string revoked_by = 8;
  google.protobuf.Timestamp revoked_at = 9;
}

message GetRolePermissionsRequest {
  string target_tenant_id = 1;
  string role = 2;
}

message SetRolePermissionsRequest {
  string target_tenant_id = 1;
  string role = 2;
  repeated string permissions = 3;
  string idempotency_key = 4;
}

message RolePermissions {
  string tenant_id = 1;
  string role = 2;
  repeated string permissions = 3;
  // False while the tenant uses the SRS 3.2 defaults.
  bool customized = 4;
}

message StartBreakGlassRequest {
  string target_tenant_id = 1;
  // At least 20 characters, and kept in the tenant's audit record.
  string reason = 2;
  // From 1 to 240. Zero means 60.
  uint32 duration_minutes = 3;
  string idempotency_key = 4;
}

message EndBreakGlassRequest {
  string grant_id = 1;
  string idempotency_key = 2;
}

message BreakGlassGrant {
  string grant_id = 1;
  string tenant_id = 2;
  string user_id = 3;
  string reason = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  // Empty unless it was ended early.
  google.protobuf.Timestamp ended_at = 7;
}

message GrantRoleResponse {
  // Unset while the change waits for a second Tenant Administrator.
  RoleGrant grant = 1;
  // Set instead when it changes who may approve maintenance (RBAC-007).
  PendingChange pending = 2;
}

message RevokeRoleResponse {
  RoleGrant grant = 1;
  PendingChange pending = 2;
}

message GetRolePermissionsResponse {
  RolePermissions role_permissions = 1;
}

message SetRolePermissionsResponse {
  RolePermissions role_permissions = 1;
  PendingChange pending = 2;
}

// A change to who may approve maintenance, waiting for a second person (RBAC-007).
message PendingChange {
  string change_id = 1;
  string tenant_id = 2;
  // "grant", "revoke" or "role_permissions".
  string kind = 3;
  // What it does, in words, such as "Give u-1 the maintenance-manager role, in the whole tenant".
  string summary = 4;
  string proposed_by = 5;
  google.protobuf.Timestamp proposed_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  // "pending", "confirmed", "declined" or "expired".
  string status = 8;
  string decided_by = 9;
  google.protobuf.Timestamp decided_at = 10;
  string decline_reason = 11;
  // The tenant had no other Tenant Administrator when it was proposed, so a Platform
  // Administrator may confirm it.
  bool escalated = 12;
  // The request it applies once confirmed: the role, the user and the grant it concerns.
  string role = 13;
  string grantee_id = 14;
  string grant_id = 15;
  repeated string permissions = 16;
}

message ListPendingChangesRequest {
  string target_tenant_id = 1;
  // Also those confirmed, declined or expired.
  bool include_decided = 2;
}

message ListPendingChangesResponse {
  repeated PendingChange changes = 1;
}

message ConfirmChangeRequest {
  string target_tenant_id = 1;
  string change_id = 2;
  string idempotency_key = 3;
}

message ConfirmChangeResponse {
  PendingChange change = 1;
  // What it applied: a grant, a revocation, or the role's new permissions.
  RoleGrant grant = 2;
  RolePermissions role_permissions = 3;
}

message DeclineChangeRequest {
  string target_tenant_id = 1;
  string change_id = 2;
  string reason = 3;
  string idempotency_key = 4;
}

message DeclineChangeResponse {
  PendingChange change = 1;
}

message StartBreakGlassResponse {
  BreakGlassGrant grant = 1;
}

message EndBreakGlassResponse {
  BreakGlassGrant grant = 1;
}

message ListMyPermissionsRequest {}

message ScopedPermission {
  string permission = 1;
  // Where it applies. Both empty means the whole tenant.
  Scope scope = 2;
}

message ScopedRole {
  string role = 1;
  Scope scope = 2;
}

message ListMyPermissionsResponse {
  repeated ScopedRole roles = 1;
  repeated ScopedPermission permissions = 2;
}

message ListMyBreakGlassGrantsRequest {}

message ListMyBreakGlassGrantsResponse {
  repeated BreakGlassGrant grants = 1;
}
