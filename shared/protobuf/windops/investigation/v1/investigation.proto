syntax = "proto3";

package windops.investigation.v1;

import "google/protobuf/timestamp.proto";

// Investigation cases: what is being looked into on a turbine, and why (FR-INV-001, FR-FLT-004).
//
// A case starts in one of two ways. A person with investigation.create opens one. Or a detection
// arrives as fault.detected, and the versioned case rules decide: it joins the turbine's active
// case for the same component, or opens a new one, so one fault makes one case. A case's severity
// is the highest of its detections', worked out, never judged.
//
// The tenant comes from the caller's verified identity (GRP-004). Reading needs
// investigation.read for the turbine, its wind farm or the tenant; cancelling needs
// investigation.cancel there. A case the caller may not read is not found. Every change is kept in
// the case's history, announced as case.updated and audited, and a change may be retried with the
// same idempotency_key (GRP-007).
service InvestigationService {
  rpc CreateCase(CreateCaseRequest) returns (CreateCaseResponse);
  // Active cases by default: open, investigating and pending review, most severe and newest first.
  rpc ListCases(ListCasesRequest) returns (ListCasesResponse);
  // With its detections and its history.
  rpc GetCase(GetCaseRequest) returns (GetCaseResponse);
  rpc CancelCase(CancelCaseRequest) returns (CancelCaseResponse);

  // A case's evidence, frozen (FR-INV-002, EVD-001 to 004): the turbine, its telemetry window,
  // its alarms, each detection and the exact rule version behind it, each item hashed, and the
  // snapshot hashed over them all. It never changes once made. A case gets its first when it is
  // created, and a new version when detections join it, or on request.
  //
  // Requesting one needs investigation.create for the case's turbine, and freezes it as the
  // caller, who must be able to read what it holds. Reading needs investigation.read.
  rpc CreateEvidenceSnapshot(CreateEvidenceSnapshotRequest) returns (CreateEvidenceSnapshotResponse);
  // With every item, and whether its hashes still match what it holds.
  rpc GetEvidenceSnapshot(GetEvidenceSnapshotRequest) returns (GetEvidenceSnapshotResponse);
  // A case's snapshots, newest version first, without their items.
  rpc ListEvidenceSnapshots(ListEvidenceSnapshotsRequest) returns (ListEvidenceSnapshotsResponse);
}

message Case {
  string case_id = 1;
  string turbine_id = 2;
  // What the case is about, from the case rules, such as "gearbox". "turbine" for a person's case,
  // or a detection whose rule the case rules do not know.
  string component_group = 3;
  string title = 4;
  // "open", "investigating", "pending_review", "closed" or "cancelled".
  string status = 5;
  // "low", "medium", "high" or "critical": the highest of its detections, or a person's choice
  // for a case they open by hand.
  string severity = 6;
  // "detection" or "user".
  string origin = 7;
  // A user, or the service whose detection opened it.
  string created_by = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp last_detection_at = 11;
  int64 detection_count = 12;
  // The case rules that grouped its detections, such as "case-rules-1".
  string case_rules_version = 13;
  string cancel_reason = 14;
  int64 version = 15;
  // The case's newest evidence snapshot, and its version. Empty until the first is frozen.
  string evidence_snapshot_id = 16;
  int64 evidence_version = 17;
  // "pending" while a snapshot is still to be frozen, as when one of its sources cannot be
  // reached (SRS 7.7), or "ready".
  string evidence_status = 18;
}

message CaseDetection {
  string detection_id = 1;
  string rule_id = 2;
  string rule_version = 3;
  string severity = 4;
  string telemetry_snapshot_id = 5;
  google.protobuf.Timestamp attached_at = 6;
}

message CaseEvent {
  google.protobuf.Timestamp at = 1;
  // "created", "detection_attached", "severity_raised" or "cancelled".
  string action = 2;
  // "user" or "service".
  string actor_type = 3;
  string actor_id = 4;
  string note = 5;
}

message CreateCaseRequest {
  string turbine_id = 1;
  string title = 2;
  // "low", "medium", "high" or "critical": how urgent the person judges it, until detections say.
  string severity = 3;
  string idempotency_key = 4;
}

message CreateCaseResponse {
  Case case = 1;
}

message ListCasesRequest {
  // Empty means open, investigating and pending_review.
  repeated string statuses = 1;
  string turbine_id = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListCasesResponse {
  repeated Case cases = 1;
  string next_page_token = 2;
}

message GetCaseRequest {
  string case_id = 1;
}

message GetCaseResponse {
  Case case = 1;
  repeated CaseDetection detections = 2;
  // Oldest first.
  repeated CaseEvent history = 3;
}

message CancelCaseRequest {
  string case_id = 1;
  // Why, for whoever looks next. Required.
  string reason = 2;
  string idempotency_key = 3;
}

message CancelCaseResponse {
  Case case = 1;
}

// One record a snapshot holds, as it was when frozen (EVD-002).
message EvidenceItem {
  // "asset", "telemetry", "alarm" or "fault-detection".
  string source_service = 1;
  // "turbine", "telemetry_snapshot", "alarm", "detection" or "fault_rule_version".
  string record_type = 2;
  string record_id = 3;
  string version = 4;
  // The window it covers, when it has one.
  google.protobuf.Timestamp window_start = 5;
  google.protobuf.Timestamp window_end = 6;
  google.protobuf.Timestamp retrieved_at = 7;
  // As JSON: for telemetry, each quality label's count, its gaps and rejections; else "{}".
  string data_quality_json = 8;
  // The record, frozen, as canonical JSON.
  string content_json = 9;
  // sha256 over content_json.
  string content_hash = 10;
}

message EvidenceSnapshot {
  string snapshot_id = 1;
  string case_id = 2;
  int64 version = 3;
  string turbine_id = 4;
  // sha256 over its header and every item's hash, as hash_format says.
  string content_hash = 5;
  // "windops-evidence-snapshot-v1".
  string hash_format = 6;
  google.protobuf.Timestamp created_at = 7;
  // A user, or the service that froze it.
  string created_by = 8;
  google.protobuf.Timestamp window_start = 9;
  google.protobuf.Timestamp window_end = 10;
  int64 item_count = 11;
  repeated EvidenceItem items = 12;
  // True when every hash still matches what it holds.
  bool verified = 13;
}

message CreateEvidenceSnapshotRequest {
  string case_id = 1;
  string idempotency_key = 2;
}

message CreateEvidenceSnapshotResponse {
  EvidenceSnapshot snapshot = 1;
}

message GetEvidenceSnapshotRequest {
  string snapshot_id = 1;
}

message GetEvidenceSnapshotResponse {
  EvidenceSnapshot snapshot = 1;
}

message ListEvidenceSnapshotsRequest {
  string case_id = 1;
}

message ListEvidenceSnapshotsResponse {
  repeated EvidenceSnapshot snapshots = 1;
}
