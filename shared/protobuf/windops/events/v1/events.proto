syntax = "proto3";
package windops.events.v1;

import "google/protobuf/timestamp.proto";
import "windops/telemetry/v1/telemetry.proto";

// Every durable event in SRS 7.6, with what a consumer needs to route, trace and validate it.
message EventEnvelope {
  // Stable across retries, so consumers and JetStream can recognize a duplicate (EVT-003).
  string event_id = 1;
  // Required on every event, and validated by every consumer (DAT-007).
  string tenant_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
  // The service that published the event.
  string producer = 4;
  string trace_parent = 5;
  string request_id = 6;
  oneof payload {
    TelemetryReceived telemetry_received = 10;
    TelemetryQualityChanged telemetry_quality = 11;
    AlarmChanged alarm_changed = 12;
    FaultDetected fault_detected = 13;
    CaseUpdated case_updated = 14;
    EvidenceChanged evidence_changed = 15;
    WorkOrderSubmitted work_order_submitted = 16;
    ApprovalDecided approval_decided = 17;
    WorkOrderCompleted work_order_completed = 18;
    AuditRecorded audit_recorded = 19;
    AuditRequested audit_requested = 20;
    AlarmReported alarm_reported = 21;
  }
}

// Events carry identifiers rather than sensitive evidence. Consumers fetch details from the owner.
message TelemetryReceived {
  string turbine_id = 1;
  string batch_id = 2;
  uint32 sample_count = 3;
}

message TelemetryQualityChanged {
  string turbine_id = 1;
  string batch_id = 2;
  windops.telemetry.v1.Quality quality = 3;
}

message AlarmChanged {
  string alarm_id = 1;
  string turbine_id = 2;
  AlarmState state = 3;
  string code = 4;
  // "low", "medium", "high" or "critical".
  string severity = 5;
  // The alarm's version after this change.
  int64 version = 6;
}

// A turbine's controller raised or cleared an alarm, as its device sent it through the device
// route. The Alarm Service owns what it means (FR-ALM-001).
message AlarmReported {
  string turbine_id = 1;
  string device_id = 2;
  // The device's own ID for this report, so a repeat changes nothing.
  string report_id = 3;
  string code = 4;
  // What raised it, such as a reading's name, when one code covers several.
  string tag = 5;
  // "raise" or "clear".
  string action = 6;
  google.protobuf.Timestamp event_time = 7;
  google.protobuf.Timestamp received_at = 8;
  // "low", "medium", "high" or "critical", or empty for the catalogue's default.
  string severity = 9;
  string message = 10;
  string source = 11;
}

enum AlarmState {
  ALARM_STATE_UNSPECIFIED = 0;
  ALARM_STATE_ACTIVE = 1;
  ALARM_STATE_ACKNOWLEDGED = 2;
  ALARM_STATE_CLEARED = 3;
  ALARM_STATE_SHELVED = 4;
}

message FaultDetected {
  string detection_id = 1;
  string turbine_id = 2;
  string rule_version = 3;
  string telemetry_snapshot_id = 4;
  string rule_id = 5;
  // "low", "medium", "high" or "critical", from the rule's levels (FR-FLT-005).
  string severity = 6;
  string rule_content_hash = 7;
}

message CaseUpdated {
  string case_id = 1;
  string status = 2;
  string turbine_id = 3;
  string severity = 4;
  // "created", "detection_attached", "severity_raised", "evidence_frozen", "stale" or
  // "cancelled", among others.
  string action = 5;
  // The case's version after this change.
  int64 version = 6;
  // The case's newest evidence snapshot.
  string evidence_snapshot_id = 7;
  // Set while that snapshot is stale (SRS 8.5, M10.3): the rule that fired first, such as
  // "inventory", what it found, and the rules' version, such as "stale-rules-1". Empty when
  // fresh. A new snapshot clears them.
  string stale_rule = 8;
  string stale_detail = 9;
  string stale_rules_version = 10;
  // The person who opened the case, by user ID, to be told how it goes (M10.5). Empty for a case
  // from detections.
  string requested_by = 11;
  // The work order a verification is about, and its outcome: "resolved", "not_resolved" or
  // "inconclusive" (SRS 5.4 step 15, M10.6). Empty for any other change.
  string work_order_id = 12;
  string verification_outcome = 13;
}

// A source record changed, which can make a recommendation stale (SRS 8.5).
message EvidenceChanged {
  string source_service = 1;
  string record_id = 2;
  string version = 3;
}

message WorkOrderSubmitted {
  string work_order_id = 1;
  string proposal_version = 2;
  // What the Approval Service needs to open a request without calling back (M10.1). It still
  // rechecks the work order and the case when a decision arrives (EVD-009).
  string case_id = 3;
  string turbine_id = 4;
  string evidence_snapshot_id = 5;
  string submitted_by = 6;
  // The person, or principal, it was drafted for, and the agent that drafted it, if any.
  string drafted_by = 7;
  string drafted_by_agent = 8;
  // What the Investigation Service watches to know when it goes stale (SRS 8.5, M10.3): its
  // parts, with what the Inventory Service found at submission, and the procedures it cites.
  repeated ProposedPart parts = 9;
  repeated string procedures = 10;
  // The Policy Service's result at submission, and the impact estimate it judged: what the
  // weather rule compares a newer forecast with (SRS 8.5, M10.3b).
  string policy_result_id = 11;
  string impact_result_id = 12;
}

message ProposedPart {
  string part_number = 1;
  int32 quantity = 2;
  // "available", "short", "incompatible", "retired" or "unknown", when submitted.
  string status = 3;
}

message ApprovalDecided {
  string approval_id = 1;
  string work_order_id = 2;
  string proposal_version = 3;
  string evidence_snapshot_id = 4;
  ApprovalDecision decision = 5;
  // The person who decided. Never an agent (FR-APR-001).
  string decided_by = 6;
  // The case the proposal was made for, whose workflow resumes on the decision (SRS 5.4 step 14).
  string case_id = 7;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVED = 1;
  APPROVAL_DECISION_REJECTED = 2;
}

// A person recorded the approved work as done (FR-MNT-004), which starts its verification
// (SRS 5.4 step 15). Identifiers and times only: the completion's notes stay with the work order.
message WorkOrderCompleted {
  string work_order_id = 1;
  // When the work ended on site, as the person recorded it.
  google.protobuf.Timestamp completed_at = 2;
  string case_id = 3;
  string turbine_id = 4;
  string proposal_version = 5;
  // The evidence snapshot the approved version stood on.
  string evidence_snapshot_id = 6;
  string completed_by = 7;
  google.protobuf.Timestamp started_at = 8;
}

// Asks the Audit Service to record something (FR-AUD-001). Sent on `audit.requested.<service>`, so a
// service cannot file a request in another's name.
message AuditRequested {
  string action = 1;
  // For example "user", "agent" or "service".
  string actor_type = 2;
  string actor_id = 3;
  // The user or service principal behind an agent (SEC-010).
  string on_behalf_of = 4;
  string resource_type = 5;
  string resource_id = 6;
  // For example "succeeded", "denied" or "failed".
  string outcome = 7;
  // Shared with LangSmith traces (OBS-008).
  string correlation_id = 8;
}

message AuditRecorded {
  string audit_record_id = 1;
  string record_hash = 2;
}
