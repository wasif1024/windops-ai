[project]
name = "windops-grpc"
version = "0.1.0"
description = "gRPC server, client and service runtime for WindOps services (SRS 7.4)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "grpcio>=1.85.1",
    "grpcio-health-checking>=1.85.1",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-prometheus>=0.66b2",
    "prometheus-client>=0.26.0",
    "uvicorn>=0.54.0",
    "windops-auth",
    "windops-observability",
    "windops-resilience",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windops_grpc"]

[tool.uv.sources]
windops-observability = { workspace = true }
windops-resilience = { workspace = true }
