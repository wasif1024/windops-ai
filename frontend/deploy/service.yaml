# Reached only through the gateway, which serves it at https://localhost:9443/.
apiVersion: v1
kind: Service
metadata:
  name: windops-frontend
  labels:
    app.kubernetes.io/name: windops-frontend
    app.kubernetes.io/part-of: windops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: windops-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
