<svg xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" viewBox="0 0 760 736" role="img" aria-label="Agents reach services only through MCP and gRPC, behind circuit breakers" font-size="13"><title>Agents reach services only through MCP and gRPC, behind circuit breakers</title><rect width="760" height="736" rx="8" fill="#FFFFFF"/><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#0F172A">Agents reach services only through MCP and gRPC, behind circuit breakers</text><g fill="none" stroke="#64748B" stroke-width="1.25"><path d="M132 92V116" marker-end="url(#arch-arrow)"></path><path d="M364 92V116" marker-end="url(#arch-arrow)"></path><path d="M132 156V180" marker-end="url(#arch-arrow)"></path><path d="M364 156V244" marker-end="url(#arch-arrow)"></path><path d="M132 220V244" marker-end="url(#arch-arrow)"></path><path d="M612 472V488" marker-end="url(#arch-arrow)"></path><path d="M148 488V472" marker-end="url(#arch-arrow)"></path><path d="M380 488V472" marker-end="url(#arch-arrow)"></path><path d="M137 544V584" marker-end="url(#arch-arrow)"></path><path d="M380 544V584" marker-end="url(#arch-arrow)"></path><path d="M623 544V584" marker-end="url(#arch-arrow)"></path></g><g><rect x="24" y="52" width="216" height="40" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="132" y="76" text-anchor="middle" font-weight="600" fill="#0F172A">React frontend</text></g><g><rect x="256" y="52" width="216" height="40" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="364" y="76" text-anchor="middle" font-weight="600" fill="#0F172A">Telemetry simulator</text></g><text x="144" y="108" font-size="11.5" fill="#475569">HTTPS, REST, SSE</text><g><rect x="24" y="116" width="712" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.25"></rect><text x="380" y="140" text-anchor="middle" font-weight="600" fill="#0F172A">APISIX API Gateway: TLS, OIDC, rate limits and CORS</text></g><g><rect x="24" y="180" width="216" height="40" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="132" y="204" text-anchor="middle" font-weight="600" fill="#0F172A">Web BFF</text></g><text x="376" y="204" font-size="11.5" fill="#475569">authenticated device route to Telemetry</text><text x="144" y="238" font-size="11.5" fill="#475569">gRPC, circuit breakers</text><g><rect x="24" y="244" width="712" height="300" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="40" y="266" font-weight="600" fill="#0F172A">Domain services: one image and data boundary each</text></g><g><rect x="40" y="280" width="216" height="88" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="56" y="304" font-weight="600" fill="#0F172A">Platform</text><text x="56" y="320" font-size="11.5" fill="#475569">Identity, Authorization,</text><text x="56" y="336" font-size="11.5" fill="#475569">Tenant, Audit, Notification</text></g><g><rect x="272" y="280" width="216" height="88" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="288" y="304" font-weight="600" fill="#0F172A">Operations</text><text x="288" y="320" font-size="11.5" fill="#475569">Asset, Telemetry, Alarm,</text><text x="288" y="336" font-size="11.5" fill="#475569">Fault Detection,</text><text x="288" y="352" font-size="11.5" fill="#475569">Investigation</text></g><g><rect x="504" y="280" width="216" height="88" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="520" y="304" font-weight="600" fill="#0F172A">Deterministic decisions</text><text x="520" y="320" font-size="11.5" fill="#475569">Policy, Production Impact,</text><text x="520" y="336" font-size="11.5" fill="#475569">Approval</text></g><g><rect x="40" y="384" width="216" height="88" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="56" y="408" font-weight="600" fill="#0F172A">Maintenance</text><text x="56" y="424" font-size="11.5" fill="#475569">Maintenance, Inventory</text></g><g><rect x="272" y="384" width="216" height="88" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="288" y="408" font-weight="600" fill="#0F172A">Intelligence</text><text x="288" y="424" font-size="11.5" fill="#475569">Knowledge, Weather,</text><text x="288" y="440" font-size="11.5" fill="#475569">External Intelligence</text></g><g><rect x="504" y="384" width="216" height="88" rx="8" fill="#6D4AE8" fill-opacity="0.12" stroke="#6D4AE8" stroke-width="2"></rect><text x="520" y="408" font-weight="600" fill="#0F172A">Agents and evaluation</text><text x="520" y="424" font-size="11.5" fill="#0F172A">Agent Runtime, Evaluation,</text><text x="520" y="440" font-size="11.5" fill="#0F172A">Agent Sandbox Adapter</text></g><g><rect x="40" y="488" width="680" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.25"></rect><text x="380" y="512" text-anchor="middle" font-size="11.5" fill="#0F172A">MCP servers: allowlisted agent tools that call services over gRPC, with no direct data access</text></g><g><rect x="24" y="584" width="226" height="72" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="40" y="608" font-weight="600" fill="#0F172A">Data stores</text><text x="40" y="624" font-size="11.5" fill="#475569">PostgreSQL with TimescaleDB,</text><text x="40" y="640" font-size="11.5" fill="#475569">Redis, Qdrant</text></g><g><rect x="267" y="584" width="226" height="72" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="283" y="608" font-weight="600" fill="#0F172A">NATS JetStream</text><text x="283" y="624" font-size="11.5" fill="#475569">Outbox events, work queues,</text><text x="283" y="640" font-size="11.5" fill="#475569">dead-letter stream</text></g><g><rect x="510" y="584" width="226" height="72" rx="8" fill="none" stroke="#64748B" stroke-width="1.25"></rect><text x="526" y="608" font-weight="600" fill="#0F172A">External APIs</text><text x="526" y="624" font-size="11.5" fill="#475569">Claude, Tavily, forecast,</text><text x="526" y="640" font-size="11.5" fill="#475569">LangSmith, via egress rules</text></g><g><rect x="24" y="672" width="712" height="40" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.25"></rect><text x="380" y="696" text-anchor="middle" font-size="11.5" fill="#0F172A">Every workload: OpenTelemetry, Prometheus, Grafana, Loki, Fluent Bit and Alertmanager</text></g></svg>
